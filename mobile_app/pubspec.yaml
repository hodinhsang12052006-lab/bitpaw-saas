name: bitpaw_mobile
description: "BitPaw OS - Mobile POS/ERP App (Flutter, iOS & Android)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # --- Network: Dio + Interceptor tự đính kèm Bearer token vào mọi request ---
  dio: ^5.4.3+1

  # --- Quản lý State: Provider (đơn giản, ít khái niệm hơn Riverpod, đủ dùng cho luồng auth) ---
  provider: ^6.1.2

  # --- Lưu token an toàn: Keychain (iOS) / EncryptedSharedPreferences (Android)
  # TUYỆT ĐỐI không dùng shared_preferences cho JWT — SharedPreferences lưu plaintext,
  # đọc được dễ dàng trên máy đã root/jailbreak. flutter_secure_storage mã hoá tại chỗ,
  # dùng đúng keystore/keychain gốc của hệ điều hành. ---
  flutter_secure_storage: ^9.2.2

  # --- GPS cho chấm công: backend (_enforce_checkin_geofence, app.py) TỰ so khoảng cách
  # Haversine giữa toạ độ gửi lên và toạ độ chi nhánh, từ chối nếu quá 50m — geolocator chỉ cần
  # lấy đúng toạ độ hiện tại + tự xin quyền vị trí, không cần tự tính khoảng cách ở client. ---
  geolocator: ^13.0.1

  # --- Định dạng ngày/tiền tệ tiếng Việt cho màn Báo cáo (khớp cách web hiển thị) ---
  intl: ^0.19.0

  # --- Quét mã vạch bằng camera cho Retail POS — dùng CameraX (Android)/AVFoundation (iOS)
  # native qua platform view, không cần model nhận diện riêng. ---
  mobile_scanner: ^5.2.3

  # --- Chụp ảnh hiện trường job Kỹ Thuật (bằng chứng hoàn thành) ---
  image_picker: ^1.1.2

  # --- Chữ ký khách hàng vẽ bằng ngón tay, xuất PNG để upload — cùng chuẩn 'job_signature'
  # backend đã hỗ trợ sẵn qua /api/storage/upload (xem api_tasks_complete, app.py). ---
  signature: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
