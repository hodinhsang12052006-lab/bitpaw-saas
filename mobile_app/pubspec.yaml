name: bitpaw_mobile
description: "BitPaw OS - Mobile POS/ERP App (Flutter, iOS & Android)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # --- WebView: bọc thẳng web app (đã kiểm thử kỹ, đầy đủ chức năng POS/Payroll/Booking)
  # vào khung app native để lên CH Play NHANH nhất, thay vì viết lại toàn bộ UI bằng Flutter
  # (sẽ mất nhiều tuần). Native login/JWT ở trên tạm không dùng tới cho bản này — xem
  # main.dart.
  # Dùng thẳng package Android-only (thay vì umbrella webview_flutter) vì umbrella package
  # kéo theo webview_flutter_wkwebview (iOS) -> package objective_c -> cần Dart native assets
  # hooks, mà hooks_runner trên Windows có bug đã biết (dart-lang/native#2993) khi đường dẫn
  # user/project chứa dấu cách — máy này là "Acer Nitro" nên luôn dính. App chỉ nhắm Android
  # (CH Play) nên không cần umbrella package. ---
  webview_flutter_android: ^4.3.4
  webview_flutter_platform_interface: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
