name: bitpaw_mobile
description: "BitPaw OS - Mobile POS/ERP App (Flutter, iOS & Android)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # --- WebView: bọc thẳng web app (đã kiểm thử kỹ, đầy đủ chức năng POS/Payroll/Booking)
  # vào khung app native cho CẢ CH Play (Android WebView) lẫn App Store (WKWebView).
  # Trước đây chỉ dùng package Android-only vì webview_flutter_wkwebview đời cũ kéo theo
  # package objective_c (Dart native assets hooks lỗi trên Windows khi đường dẫn có dấu cách,
  # dart-lang/native#2993) -> bản iOS hoàn toàn không có WebView. Từ wkwebview 3.27 không còn
  # phụ thuộc objective_c nên dùng lại umbrella webview_flutter + 2 implementation riêng (để
  # gọi API riêng từng nền tảng: chọn file, quyền camera/GPS, cử chỉ vuốt lùi iOS). ---
  webview_flutter_android: ^4.14.1
  webview_flutter: ^4.14.1
  webview_flutter_wkwebview: ^3.27.0
  url_launcher: ^6.3.2
  permission_handler: ^13.0.2
  file_picker: ^13.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
