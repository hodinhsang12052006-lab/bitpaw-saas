<!-- Reusable Premium CSKH Global Component (Dark Neon / Glassmorphism) -->

        <h4 class="text-white font-extrabold mb-5 uppercase tracking-widest text-sm border-b border-cyan-500/30 w-max pb-2 flex items-center gap-2">
            <i class="fas fa-headset text-cyan-400"></i> <span data-i18n="cskh_title">LIÊN HỆ VỚI SẾP</span>
        </h4>

        <ul class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm text-gray-300">
            <li class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-full bg-cyan-500/10 flex justify-center items-center shrink-0 border border-cyan-500/30 group-hover:bg-cyan-500/30 transition">
                    <i class="fas fa-phone-alt text-cyan-400 text-base"></i>
                </div>
                <div>
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold" data-i18n="cskh_hotline_label">Hotline 24/7</p>
                    <a href="tel:+61866294204" class="hover:text-cyan-400 transition font-black text-sm tracking-wide">🇦🇺 +61 8 6629 4204</a>
                </div>
            </li>

            <li class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-full bg-rose-500/10 flex justify-center items-center shrink-0 border border-rose-500/30 group-hover:bg-rose-500/30 transition">
                    <i class="fas fa-envelope text-rose-400 text-base"></i>
                </div>
                <div class="overflow-hidden min-w-0 flex-1">
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold" data-i18n="cskh_email_label">Email Công việc</p>
                    <a href="mailto:bitpawsoftware@gmail.com" class="hover:text-rose-400 transition font-bold block truncate text-xs" title="bitpawsoftware@gmail.com">bitpawsoftware@gmail.com</a>
                </div>
            </li>

            <li class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-full bg-blue-500/10 flex justify-center items-center shrink-0 border border-blue-500/30 group-hover:bg-blue-500/30 transition">
                    <i class="fas fa-comment-dots text-blue-400 text-base"></i>
                </div>
                <div>
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold" data-i18n="cskh_zalo_label">Zalo Support</p>
                    <a href="https://zalo.me/0794678904" target="_blank" class="hover:text-blue-400 transition font-bold text-xs" data-i18n="cskh_zalo_value">Zalo Kỹ Thuật</a>
                </div>
            </li>

            <li class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-full bg-indigo-600/10 flex justify-center items-center shrink-0 border border-indigo-600/30 group-hover:bg-indigo-600/30 transition">
                    <i class="fab fa-facebook-messenger text-indigo-400 text-base"></i>
                </div>
                <div>
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold" data-i18n="cskh_fanpage_label">Fanpage Chính Thức</p>
                    <a href="https://www.facebook.com/profile.php?id=61591611704371" target="_blank" class="hover:text-indigo-400 transition font-bold text-xs">Bitpaw Official</a>
                </div>
            </li>
        </ul>
    </div>
</div>
<script>
    // Đa doanh nghiệp (multi-tenant): ƯU TIÊN business_id trang cha tự truyền vào (biến Jinja
    // `widget_business_id` — dùng cho các trang công khai của ĐÚNG 1 tenant cụ thể, vd trang
    // đặt lịch/QR menu riêng của 1 tiệm, KHÔNG cần đăng nhập vẫn biết đang phục vụ tenant nào),
    // rồi mới fallback về session.business_id (dùng khi test nội bộ có đăng nhập). Trước đây
    // component này CHỈ đọc session — khiến mọi trang công khai (khách ẩn danh, không session)
    // luôn nhận null dù trang đó rõ ràng thuộc về 1 tenant cụ thể, làm bot mất sạch bảng giá/
    // persona riêng của tiệm. Trang marketing chung của BitPaw (không thuộc tenant nào) vẫn
    // đúng đắn nhận null ở cả 2 nguồn, dùng persona chung theo ngành như cũ.
    window.BITPAW_BUSINESS_ID = {{ (widget_business_id if widget_business_id is defined else session.get('business_id')) | tojson }};

    // Bản dịch riêng, độc lập với hệ thống i18n của trang cha (mỗi trang cha có cơ chế
    // đổi ngôn ngữ khác nhau) — component này tự đọc 'bitpaw_lang' đã lưu để hiển thị đúng
    // ngôn ngữ ngay từ lần render đầu, không cần trang cha gọi hàm gì thêm.
    (function () {
        var cskhTranslations = {
            vi: {
                cskh_title: 'LIÊN HỆ VỚI SẾP',
                cskh_hotline_label: 'Hotline 24/7',
                cskh_email_label: 'Email Công việc',
                cskh_zalo_label: 'Zalo Support',
                cskh_zalo_value: 'Zalo Kỹ Thuật',
                cskh_fanpage_label: 'Fanpage Chính Thức'
            },
            en: {
                cskh_title: 'CONTACT THE OWNER',
                cskh_hotline_label: 'Hotline 24/7',
                cskh_email_label: 'Work Email',
                cskh_zalo_label: 'Zalo Support',
                cskh_zalo_value: 'Technical Zalo',
                cskh_fanpage_label: 'Official Fanpage'
            }
        };
        var lang = localStorage.getItem('bitpaw_lang') || "{{ default_lang }}";
        var dict = cskhTranslations[lang] || cskhTranslations.vi;
        document.querySelectorAll('#cskh-static-block [data-i18n]').forEach(function (el) {
            var key = el.getAttribute('data-i18n');
            if (dict[key]) el.textContent = dict[key];
        });
    })();
</script>
<script src="/static/js/cskh_widget.js"></script>
