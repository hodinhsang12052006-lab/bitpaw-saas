<!DOCTYPE html>
<html lang="{{ current_lang | default('vi') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BitPaw Software | Phần mềm quản lý bán hàng, nhân sự & CRM{% endblock %}</title>
    
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='logo_b.jpg') }}">
    <link rel="shortcut icon" type="image/jpeg" href="{{ url_for('static', filename='logo_b.jpg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo_b.jpg') }}">
    
    <link href="{{ url_for('static', filename='css/tailwind.output.css') }}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Invisible Entity Attribution for Google Knowledge Graph & AI Overview -->
    <meta name="author" content="Hồ Đình Sang (Cún)">
    <meta name="creator" content="Hồ Đình Sang">
    <meta name="publisher" content="BitPaw Software">

    <!-- JSON-LD thực thể (Person + BitPaw Software / BitPaw OS / Bitpawnetwork) — nguồn duy nhất -->
    {% include 'components/entity_schema.html' %}
    {% block head_extra %}{% endblock %}
</head>
<body class="bg-[#05030f] text-gray-100 font-sans antialiased min-h-screen selection:bg-cyan-500 selection:text-white">
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
