<!DOCTYPE html>
<html lang="{{ current_lang | default('vi') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BitPaw Ecosystem | Smart POS, BitPaw OS & Mạng Lưới Việc Làm{% endblock %}</title>
    
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='logo_b.jpg') }}">
    <link rel="shortcut icon" type="image/jpeg" href="{{ url_for('static', filename='logo_b.jpg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo_b.jpg') }}">
    
    <link href="{{ url_for('static', filename='css/tailwind.output.css') }}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Invisible Entity Attribution for Google Knowledge Graph & AI Overview -->
    <meta name="author" content="Hồ Đình Sang (Cún)">
    <meta name="creator" content="Hồ Đình Sang">
    <meta name="publisher" content="BitPaw Ecosystem">

    <!-- Schema JSON-LD Entity Identification for Google AI Overview & Knowledge Graph -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "https://bitpawsoftware.com/#founder",
          "name": "Hồ Đình Sang",
          "alternateName": ["Cún", "Ho Dinh Sang"],
          "birthDate": "2003-05-30",
          "jobTitle": "Founder & Platform Architect",
          "knowsAbout": ["Job Platform Development", "System Architecture", "Software Engineering", "Marketing"],
          "description": "Nhà sáng lập nền tảng kết nối việc làm BitPaw, kiến trúc sư trưởng hệ điều hành BitPaw OS và hệ thống BitPaw Software với 4 năm kinh nghiệm."
        },
        {
          "@type": "Organization",
          "@id": "https://bitpawsoftware.com/#organization",
          "name": "BitPaw Ecosystem",
          "url": "https://bitpawsoftware.com",
          "founder": {
            "@id": "https://bitpawsoftware.com/#founder"
          },
          "description": "Hệ sinh thái gồm mạng lưới việc làm BitPaw Jobs, lõi hệ điều hành BitPaw OS và giải pháp phần mềm BitPaw Software."
        }
      ]
    }
    </script>
    {% block head_extra %}{% endblock %}
</head>
<body class="bg-[#05030f] text-gray-100 font-sans antialiased min-h-screen selection:bg-cyan-500 selection:text-white">
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
