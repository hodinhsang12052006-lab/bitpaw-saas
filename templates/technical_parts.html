<!DOCTYPE html>
<html lang="{{ default_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="tp_title">Kho Phụ Tùng | BitPaw OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #08090f; color: white; }
        .glass-panel { background: rgba(15, 20, 30, 0.55); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.06); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(234, 179, 8, 0.4); border-radius: 10px; }
        .field-input { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px 14px; color: #fff; width: 100%; outline: none; font-weight: 600; font-size: 13px; }
        .field-input:focus { border-color: #eab308; box-shadow: 0 0 0 3px rgba(234,179,8,0.15); }
        .row-card { transition: all 0.2s ease; }
        .row-card:hover { background: rgba(234,179,8,0.06); }
        .low-stock { color: #ef4444 !important; }
        .btn-mini { padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; border: 1px solid transparent; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    {% include 'components/app_sidebar.html' %}

    <main class="flex-1 p-4 md:p-8 overflow-y-auto">
        <div class="mb-8">
            <h1 class="text-3xl lg:text-4xl font-black flex items-center gap-3 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-amber-500">
                <i class="fas fa-toolbox text-yellow-400"></i> <span data-i18n="tp_header">Kho Phụ Tùng</span>
            </h1>
            <p class="text-gray-400 mt-2 text-sm" data-i18n="tp_subtitle">Theo dõi tồn kho linh kiện/phụ tùng — tự động trừ kho khi kỹ thuật viên chọn phụ tùng lúc chốt hoàn thành job.</p>
        </div>

        <div class="glass-panel rounded-3xl p-6 max-w-2xl">
            <h3 class="font-black text-white mb-4 tracking-widest text-xs uppercase flex items-center gap-2"><i class="fas fa-cubes text-yellow-400"></i> <span data-i18n="tp_parts_title">Kho Phụ Tùng</span></h3>

            <div class="grid grid-cols-3 gap-2 mb-3">
                <input type="text" id="newPartName" placeholder="Tên phụ tùng" class="field-input">
                <input type="number" id="newPartStock" placeholder="Tồn ban đầu" min="0" class="field-input">
                <input type="number" id="newPartPrice" placeholder="Đơn giá bán" min="0" class="field-input">
            </div>
            <button onclick="addPart()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-500 text-black font-black py-2.5 rounded-xl text-xs uppercase tracking-widest mb-4">
                <i class="fas fa-plus mr-1"></i> <span data-i18n="tp_add_part_btn">Thêm phụ tùng</span>
            </button>

            <div id="partsList" class="space-y-2 max-h-[28rem] overflow-y-auto pr-1"></div>
        </div>
    </main>

    <div class="toast" id="toast" style="position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(150%); background:rgba(10,12,22,0.95); border:1px solid rgba(234,179,8,0.4); color:white; padding:12px 28px; border-radius:40px; font-size:13px; font-weight:600; z-index:10010; transition:transform 0.3s ease, opacity 0.3s ease; opacity:0; max-width: 90vw; text-align:center;"></div>

    <script>
        let currentLang = localStorage.getItem('bitpaw_lang') || "{{ default_lang }}";
        const translations = {
            vi: {
                tp_title: 'Kho Phụ Tùng | BitPaw OS', tp_header: 'Kho Phụ Tùng',
                tp_subtitle: 'Theo dõi tồn kho linh kiện/phụ tùng — tự động trừ kho khi kỹ thuật viên chọn phụ tùng lúc chốt hoàn thành job.',
                tp_parts_title: 'Kho Phụ Tùng', tp_add_part_btn: 'Thêm phụ tùng',
                tp_no_parts: 'Chưa có phụ tùng nào.', tp_restock_placeholder: 'Nhập thêm',
                tp_toast_part_missing: 'Vui lòng nhập tên phụ tùng.',
                tp_toast_saved: 'Đã lưu!', tp_toast_error: 'Lỗi: ', tp_toast_deleted: 'Đã xoá.',
                tp_confirm_delete_part: 'Xoá phụ tùng này?',
            },
            en: {
                tp_title: 'Spare Parts | BitPaw OS', tp_header: 'Spare Parts',
                tp_subtitle: 'Track spare-parts stock — auto-deducted when a technician picks a part while closing out a job.',
                tp_parts_title: 'Parts Stock', tp_add_part_btn: 'Add Part',
                tp_no_parts: 'No parts yet.', tp_restock_placeholder: 'Restock',
                tp_toast_part_missing: 'Please enter a part name.',
                tp_toast_saved: 'Saved!', tp_toast_error: 'Error: ', tp_toast_deleted: 'Deleted.',
                tp_confirm_delete_part: 'Delete this part?',
            }
        };
        function t(key) { return (translations[currentLang] && translations[currentLang][key]) || translations.vi[key] || key; }
        function applyStaticTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => { if (el.closest('#app-sidebar')) return; el.innerHTML = t(el.getAttribute('data-i18n')); });
            document.title = t('tp_title');
        }
        applyStaticTranslations();

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.innerText = msg;
            el.style.transform = 'translateX(-50%) translateY(0)'; el.style.opacity = '1';
            setTimeout(() => { el.style.transform = 'translateX(-50%) translateY(150%)'; el.style.opacity = '0'; }, 3000);
        }
        function escapeHtml(str) { const d = document.createElement('div'); d.innerText = str == null ? '' : String(str); return d.innerHTML; }
        async function hrApi(path, options) {
            const res = await fetch(path, { ...options, headers: { 'Content-Type': 'application/json', ...(options && options.headers) } });
            const body = await res.json().catch(() => ({}));
            if (!res.ok || body.success === false) throw new Error(body.message || `Lỗi máy chủ (${res.status})`);
            return body;
        }

        async function loadParts() {
            try {
                const body = await hrApi('/api/tech_parts');
                const rows = body.data || [];
                const box = document.getElementById('partsList');
                if (!rows.length) { box.innerHTML = `<p class="text-gray-500 text-sm text-center py-6">${t('tp_no_parts')}</p>`; return; }
                box.innerHTML = rows.map(p => `
                    <div class="row-card rounded-xl p-3 border border-white/5 flex items-center justify-between gap-2">
                        <div class="min-w-0">
                            <div class="text-sm font-bold text-white truncate">${escapeHtml(p.name)}</div>
                            <div class="text-[11px] ${p.stock <= 0 ? 'low-stock' : 'text-gray-500'}">${Number(p.stock).toLocaleString()} còn lại · ${Number(p.unit_price || 0).toLocaleString()}₫/cái</div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <input type="number" class="field-input" style="width:80px; padding:6px 8px;" placeholder="${t('tp_restock_placeholder')}" id="restock-${p.id}">
                            <button class="btn-mini bg-emerald-500/15 text-emerald-300 border-emerald-500/40" onclick="restockPart(${p.id})"><i class="fas fa-plus"></i></button>
                            <button class="btn-mini bg-rose-500/15 text-rose-300 border-rose-500/40" onclick="deletePart(${p.id})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`).join('');
            } catch (e) { showToast(t('tp_toast_error') + e.message); }
        }

        async function addPart() {
            const name = document.getElementById('newPartName').value.trim();
            const stock = parseFloat(document.getElementById('newPartStock').value) || 0;
            const unit_price = parseFloat(document.getElementById('newPartPrice').value) || 0;
            if (!name) return showToast(t('tp_toast_part_missing'));
            try {
                await hrApi('/api/tech_parts', { method: 'POST', body: JSON.stringify({ name, stock, unit_price }) });
                document.getElementById('newPartName').value = ''; document.getElementById('newPartStock').value = ''; document.getElementById('newPartPrice').value = '';
                showToast(t('tp_toast_saved'));
                loadParts();
            } catch (e) { showToast(t('tp_toast_error') + e.message); }
        }

        async function restockPart(id) {
            const input = document.getElementById(`restock-${id}`);
            const qty = parseFloat(input.value);
            if (!qty || qty <= 0) return;
            try {
                await hrApi(`/api/tech_parts/${id}`, { method: 'PATCH', body: JSON.stringify({ restock_qty: qty }) });
                showToast(t('tp_toast_saved'));
                loadParts();
            } catch (e) { showToast(t('tp_toast_error') + e.message); }
        }

        async function deletePart(id) {
            if (!confirm(t('tp_confirm_delete_part'))) return;
            try {
                await hrApi(`/api/tech_parts/${id}`, { method: 'DELETE' });
                showToast(t('tp_toast_deleted'));
                loadParts();
            } catch (e) { showToast(t('tp_toast_error') + e.message); }
        }

        loadParts();
    </script>
</body>
</html>
