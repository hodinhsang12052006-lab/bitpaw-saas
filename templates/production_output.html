<!DOCTYPE html>
<html lang="{{ default_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="po_title">Sản Lượng | BitPaw OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #0f0a05; color: white; }
        .glass-panel { background: rgba(30, 18, 10, 0.55); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.06); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(249, 115, 22, 0.4); border-radius: 10px; }
        .field-input { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px 14px; color: #fff; width: 100%; outline: none; font-weight: 600; }
        .field-input:focus { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249,115,22,0.15); }
        .worker-row { transition: all 0.2s ease; }
        .worker-row:hover { background: rgba(249,115,22,0.06); }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    {% include 'components/app_sidebar.html' %}

    <main class="flex-1 p-4 md:p-8 overflow-y-auto">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl lg:text-4xl font-black flex items-center gap-3 text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-500">
                    <i class="fas fa-industry text-orange-400"></i> <span data-i18n="po_header">Theo Dõi Sản Lượng</span>
                </h1>
                <p class="text-gray-400 mt-2 text-sm" data-i18n="po_subtitle">Ghi nhận sản lượng theo công nhân, công đoạn, từng ca làm.</p>
            </div>
            <div class="flex items-center gap-2">
                {% if session.get('role') in ('admin', 'super_admin') %}
                <a href="{{ url_for('production_materials_page') }}" class="field-input text-sm flex items-center gap-2 hover:border-orange-400 transition" style="width:auto; text-decoration:none;">
                    <i class="fas fa-boxes-stacked text-orange-400"></i> <span data-i18n="po_materials_link">Nguyên vật liệu</span>
                </a>
                {% endif %}
                <input type="date" id="filterDate" class="field-input text-sm" style="width:auto;">
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <div class="lg:col-span-1 bg-gradient-to-br from-orange-900/40 to-black/40 border border-orange-500/30 rounded-3xl p-6 relative overflow-hidden">
                <i class="fas fa-boxes-stacked absolute -bottom-6 -right-6 text-8xl text-orange-500/10"></i>
                <h3 class="font-black text-orange-400 mb-2 tracking-widest text-xs uppercase relative z-10" data-i18n="po_total_today_label">Tổng Sản Lượng</h3>
                <div id="grandTotal" class="text-5xl font-black text-white relative z-10">0</div>
                <div id="entryCount" class="text-xs text-gray-400 mt-2 relative z-10"></div>
            </div>

            <div class="lg:col-span-2 glass-panel rounded-3xl p-6">
                <h3 class="font-black text-white mb-4 tracking-widest text-xs uppercase flex items-center gap-2"><i class="fas fa-plus-circle text-orange-400"></i> <span data-i18n="po_log_output_title">Ghi Nhận Sản Lượng</span></h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-[10px] text-gray-400 uppercase font-bold tracking-wider mb-1.5" data-i18n="po_worker_label">Công nhân</label>
                        <select id="logWorker" class="field-input"></select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 uppercase font-bold tracking-wider mb-1.5" data-i18n="po_stage_label">Công đoạn / Sản phẩm</label>
                        <input type="text" id="logStage" placeholder="VD: Đóng gói, May áo..." class="field-input">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                    <div>
                        <label class="block text-[10px] text-gray-400 uppercase font-bold tracking-wider mb-1.5" data-i18n="po_qty_label">Số lượng</label>
                        <input type="number" id="logQty" min="1" placeholder="0" class="field-input">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 uppercase font-bold tracking-wider mb-1.5" data-i18n="po_shift_label">Ca làm</label>
                        <select id="logShift" class="field-input">
                            <option value="">--</option>
                            <option value="Ca Sáng">Ca Sáng</option>
                            <option value="Ca Chiều">Ca Chiều</option>
                            <option value="Ca Đêm">Ca Đêm</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 uppercase font-bold tracking-wider mb-1.5" data-i18n="po_note_label">Ghi chú</label>
                        <input type="text" id="logNote" class="field-input">
                    </div>
                </div>
                <button onclick="submitOutput()" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-black font-black py-3 rounded-xl text-sm uppercase tracking-widest hover:scale-[1.01] transition-transform">
                    <i class="fas fa-save mr-1"></i> <span data-i18n="po_save_btn">Lưu Sản Lượng</span>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="glass-panel rounded-3xl p-6">
                <h3 class="font-black text-white mb-4 tracking-widest text-xs uppercase flex items-center gap-2"><i class="fas fa-ranking-star text-amber-400"></i> <span data-i18n="po_by_worker_title">Sản Lượng Theo Công Nhân</span></h3>
                <div id="workerSummary" class="space-y-2"></div>
            </div>
            <div class="glass-panel rounded-3xl p-6">
                <h3 class="font-black text-white mb-4 tracking-widest text-xs uppercase flex items-center gap-2"><i class="fas fa-list text-orange-400"></i> <span data-i18n="po_recent_entries_title">Bản Ghi Gần Đây</span></h3>
                <div id="recentEntries" class="space-y-2 max-h-96 overflow-y-auto pr-1"></div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast" style="position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(150%); background:rgba(10,12,22,0.95); border:1px solid rgba(249,115,22,0.4); color:white; padding:12px 28px; border-radius:40px; font-size:13px; font-weight:600; z-index:10010; transition:transform 0.3s ease, opacity 0.3s ease; opacity:0;"></div>

    <script>
        let currentLang = localStorage.getItem('bitpaw_lang') || "{{ default_lang }}";
        const translations = {
            vi: {
                po_title: 'Sản Lượng | BitPaw OS', po_header: 'Theo Dõi Sản Lượng',
                po_subtitle: 'Ghi nhận sản lượng theo công nhân, công đoạn, từng ca làm.',
                po_total_today_label: 'Tổng Sản Lượng', po_log_output_title: 'Ghi Nhận Sản Lượng',
                po_worker_label: 'Công nhân', po_stage_label: 'Công đoạn / Sản phẩm', po_qty_label: 'Số lượng',
                po_shift_label: 'Ca làm', po_note_label: 'Ghi chú', po_save_btn: 'Lưu Sản Lượng',
                po_by_worker_title: 'Sản Lượng Theo Công Nhân', po_recent_entries_title: 'Bản Ghi Gần Đây',
                po_no_data: 'Chưa có dữ liệu.', po_entries_suffix: 'lượt ghi nhận',
                po_toast_missing: 'Vui lòng chọn công nhân, nhập công đoạn và số lượng hợp lệ.',
                po_toast_saved: 'Đã lưu sản lượng!', po_toast_error: 'Lỗi: ', po_toast_load_failed: 'Không tải được dữ liệu.',
                po_select_worker: '-- Chọn công nhân --', po_materials_link: 'Nguyên vật liệu',
            },
            en: {
                po_title: 'Output | BitPaw OS', po_header: 'Production Output Tracking',
                po_subtitle: 'Log output by worker, stage, and shift.',
                po_total_today_label: 'Total Output', po_log_output_title: 'Log Output',
                po_worker_label: 'Worker', po_stage_label: 'Stage / Product', po_qty_label: 'Quantity',
                po_shift_label: 'Shift', po_note_label: 'Note', po_save_btn: 'Save Output',
                po_by_worker_title: 'Output By Worker', po_recent_entries_title: 'Recent Entries',
                po_no_data: 'No data yet.', po_entries_suffix: 'entries',
                po_toast_missing: 'Please select a worker and enter a valid stage and quantity.',
                po_toast_saved: 'Output saved!', po_toast_error: 'Error: ', po_toast_load_failed: 'Could not load data.',
                po_select_worker: '-- Select worker --', po_materials_link: 'Materials',
            }
        };
        function t(key) { return (translations[currentLang] && translations[currentLang][key]) || translations.vi[key] || key; }
        function applyStaticTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => { if (el.closest('#app-sidebar')) return; el.innerHTML = t(el.getAttribute('data-i18n')); });
            document.title = t('po_title');
            const langBtn = document.getElementById('langToggleBtn');
            if (langBtn) langBtn.innerText = currentLang === 'vi' ? 'EN' : 'VI';
        }
        function changeLanguage(lang) { currentLang = lang; localStorage.setItem('bitpaw_lang', lang); applyStaticTranslations(); loadSummary(); }
        applyStaticTranslations();
        document.getElementById('langToggleBtn')?.addEventListener('click', () => changeLanguage(currentLang === 'vi' ? 'en' : 'vi'));

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.innerText = msg;
            el.style.transform = 'translateX(-50%) translateY(0)'; el.style.opacity = '1';
            setTimeout(() => { el.style.transform = 'translateX(-50%) translateY(150%)'; el.style.opacity = '0'; }, 2500);
        }
        function escapeHtml(str) { const d = document.createElement('div'); d.innerText = str == null ? '' : String(str); return d.innerHTML; }
        async function hrApi(path, options) {
            const res = await fetch(path, { ...options, headers: { 'Content-Type': 'application/json', ...(options && options.headers) } });
            const body = await res.json().catch(() => ({}));
            if (!res.ok || body.success === false) throw new Error(body.message || `Lỗi máy chủ (${res.status})`);
            return body;
        }

        function todayDDMMYYYY() {
            const d = new Date();
            return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
        }
        function ddmmyyyyFromDateInput(v) {
            const [y, m, d] = v.split('-');
            return `${d}/${m}/${y}`;
        }
        function dateInputFromDDMMYYYY(v) {
            const [d, m, y] = v.split('/');
            return `${y}-${m}-${d}`;
        }
        document.getElementById('filterDate').value = dateInputFromDDMMYYYY(todayDDMMYYYY());
        document.getElementById('filterDate').addEventListener('change', loadSummary);

        async function loadWorkers() {
            try {
                const body = await hrApi('/api/hr/employees?sort=ho_ten');
                const sel = document.getElementById('logWorker');
                sel.innerHTML = `<option value="">${t('po_select_worker')}</option>` + (body.data || []).map(e => `<option value="${escapeHtml(e.ma_nv)}">${escapeHtml(e.ho_ten)} (${escapeHtml(e.ma_nv)})</option>`).join('');
            } catch (e) { showToast(t('po_toast_load_failed')); }
        }

        async function loadSummary() {
            const ngay = ddmmyyyyFromDateInput(document.getElementById('filterDate').value);
            try {
                const body = await hrApi(`/api/production/output/summary?ngay=${encodeURIComponent(ngay)}`);
                document.getElementById('grandTotal').innerText = (body.grand_total || 0).toLocaleString();
                const rows = body.data || [];
                document.getElementById('entryCount').innerText = `${rows.reduce((s,r)=>s+r.entries,0)} ${t('po_entries_suffix')}`;
                const box = document.getElementById('workerSummary');
                if (!rows.length) { box.innerHTML = `<p class="text-gray-500 text-sm text-center py-6">${t('po_no_data')}</p>`; }
                else {
                    const maxTotal = Math.max(...rows.map(r => r.total));
                    box.innerHTML = rows.map(r => `
                        <div class="worker-row rounded-xl p-3 border border-white/5">
                            <div class="flex justify-between items-center mb-1.5">
                                <span class="font-bold text-white text-sm">${escapeHtml(r.ho_ten)}</span>
                                <span class="text-orange-400 font-black">${r.total.toLocaleString()}</span>
                            </div>
                            <div class="w-full h-1.5 bg-white/5 rounded-full overflow-hidden">
                                <div class="h-full bg-gradient-to-r from-orange-500 to-amber-400" style="width:${maxTotal ? (r.total/maxTotal*100) : 0}%"></div>
                            </div>
                        </div>`).join('');
                }
            } catch (e) { showToast(t('po_toast_load_failed')); }

            try {
                const body2 = await hrApi(`/api/production/output?ngay=${encodeURIComponent(ngay)}`);
                const entries = body2.data || [];
                const box2 = document.getElementById('recentEntries');
                if (!entries.length) { box2.innerHTML = `<p class="text-gray-500 text-sm text-center py-6">${t('po_no_data')}</p>`; }
                else {
                    box2.innerHTML = entries.map(e => `
                        <div class="flex items-center justify-between bg-white/[0.03] rounded-xl p-3 border border-white/5">
                            <div class="min-w-0">
                                <div class="text-sm font-bold text-white truncate">${escapeHtml(e.cong_doan)}</div>
                                <div class="text-[11px] text-gray-500">${escapeHtml(e.ho_ten)} ${e.ca_lam ? '· ' + escapeHtml(e.ca_lam) : ''}</div>
                            </div>
                            <span class="text-amber-400 font-black shrink-0 ml-2">+${Number(e.so_luong).toLocaleString()}</span>
                        </div>`).join('');
                }
            } catch (e) { /* non-fatal */ }
        }

        async function submitOutput() {
            const ma_nv = document.getElementById('logWorker').value;
            const cong_doan = document.getElementById('logStage').value.trim();
            const so_luong = parseInt(document.getElementById('logQty').value, 10);
            if (!ma_nv || !cong_doan || !so_luong || so_luong <= 0) return showToast(t('po_toast_missing'));
            try {
                const body = await hrApi('/api/production/output', {
                    method: 'POST',
                    body: JSON.stringify({
                        ma_nv, cong_doan, so_luong,
                        ca_lam: document.getElementById('logShift').value,
                        ghi_chu: document.getElementById('logNote').value.trim(),
                        ngay: ddmmyyyyFromDateInput(document.getElementById('filterDate').value),
                    }),
                });
                document.getElementById('logStage').value = ''; document.getElementById('logQty').value = '';
                document.getElementById('logNote').value = '';
                // material_warnings: NVL đã âm tồn kho sau khi trừ theo công thức khớp cong_doan
                // (xem _consume_recipe_materials ở app.py) — không chặn lưu sản lượng, chỉ cảnh báo.
                const warnings = body.material_warnings || [];
                showToast(warnings.length ? (t('po_toast_saved') + ' ⚠️ ' + warnings.join(' ')) : t('po_toast_saved'));
                loadSummary();
            } catch (e) { showToast(t('po_toast_error') + e.message); }
        }

        loadWorkers();
        loadSummary();
    </script>
</body>
</html>
