<!DOCTYPE html>
<html lang="{{ default_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ 'Chat với tiệm' if default_lang == 'vi' else 'Chat with the shop' }}</title>
    
    <link href="{{ url_for('static', filename='css/tailwind.output.css') }}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background-color: #08061a; 
            color: white; 
        }
        .scan-line {
            position: fixed; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, #06b6d4, #a855f7, transparent);
            z-index: -1; pointer-events: none; opacity: 0.4;
            animation: scanMove 8s linear infinite;
        }
        @keyframes scanMove { 0% { top: -5%; } 100% { top: 105%; } }
        .glass-panel { 
            background: rgba(10, 15, 37, 0.6); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); 
        }
        .glass-input { 
            background: rgba(0,0,0,0.6); 
            border: 1px solid rgba(255,255,255,0.1); 
            color: white; 
            transition: all 0.3s; 
            padding: 12px 16px; 
            border-radius: 32px; 
            outline: none; 
            width: 100%; 
            font-size: 0.95rem;
        }
        .glass-input:focus { 
            border-color: #8b5cf6; 
            box-shadow: 0 0 20px rgba(139,92,246,0.4); 
            background: rgba(0,0,0,0.8); 
        }
        ::-webkit-scrollbar { width: 3px; } 
        ::-webkit-scrollbar-track { background: transparent; } 
        ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.3); border-radius: 10px; }
        .chat-ai { 
            background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(6,182,212,0.15)); 
            border: 1px solid rgba(139,92,246,0.3); 
            border-radius: 20px 20px 20px 8px; 
        }
        .chat-user { 
            background: linear-gradient(135deg, rgba(6,182,212,0.8), rgba(59,130,246,0.8)); 
            border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 20px 20px 8px 20px; 
        }
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }
        .suggestion-chip {
            transition: all 0.2s;
            cursor: pointer;
            user-select: none;
        }
        .suggestion-chip:active { transform: scale(0.96); }
        .suggestions-scroll {
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        .emoji-picker {
            position: absolute;
            bottom: 70px;
            left: 10px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 10px;
            display: none;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            z-index: 50;
            border: 1px solid rgba(6,182,212,0.3);
            max-width: 260px;
        }
        .emoji-picker span {
            font-size: 1.5rem;
            cursor: pointer;
            text-align: center;
            padding: 4px;
            border-radius: 12px;
            transition: 0.1s;
        }
        .emoji-picker span:hover {
            background: rgba(6,182,212,0.3);
            transform: scale(1.1);
        }
    
        /* Tia quét trang trí: nằm DƯỚI nội dung (trước đây z-index 9998 đè lên thẻ/bảng/nút -> trông như màn hình lỗi), tắt trên điện thoại + khi máy bật giảm chuyển động. */
        @media (max-width: 768px), (prefers-reduced-motion: reduce) { .scan-line, .laser-vertical { display: none !important; } }
    </style>
</head>
<body class="flex items-center justify-center antialiased overflow-x-hidden">
    
    <div class="scan-line"></div>

    <!-- Khung điện thoại -->
    <div class="w-full max-w-md min-w-0 mx-auto h-screen relative shadow-2xl border-x border-white/10 flex flex-col bg-black/20 backdrop-blur-sm">
        
        <!-- Header -->
        <div class="flex-shrink-0 p-4 pb-2 flex items-center gap-3 border-b border-white/10 bg-black/30">
            <div id="portalAvatar" class="w-9 h-9 rounded-full bg-slate-700 flex items-center justify-center text-white text-sm font-semibold shrink-0"><i class="fas fa-comment-dots"></i></div>
            <div class="min-w-0">
                <h1 id="portalTitle" class="text-base font-semibold truncate"><span data-i18n="portal_header_title">Chat với tiệm</span></h1>
                <p class="text-[9px] text-gray-400 flex items-center gap-1"><i class="fas fa-store text-[8px]"></i> <span data-i18n="portal_status_line">Nhân viên tiệm trả lời tại đây</span></p>
            </div>
            <div class="flex-1"></div>
            <button id="langToggleBtn" type="button" class="bg-white/10 hover:bg-white/20 text-white px-2 py-0.5 rounded-full text-[9px] font-bold transition mr-2">EN</button>
            <div class="text-xs text-gray-400" id="customerIdBadge"></div>
        </div>

        <!-- Main chat -->
        <main class="flex-1 min-w-0 flex flex-col overflow-hidden px-2 py-2">
            <div class="glass-panel rounded-3xl flex flex-col flex-1 overflow-hidden shadow-2xl">
                <div id="chatBox" class="flex-1 overflow-y-auto p-3 space-y-3 custom-scrollbar">
                    <div class="flex justify-center py-10 text-gray-400 text-sm" data-i18n="portal_loading_conversation">Đang tải hội thoại...</div>
                </div>

                <!-- Nút gợi ý ngang -->
                <div class="p-2 border-t border-white/10 bg-black/30">
                    <div class="suggestions-scroll flex gap-2 overflow-x-auto pb-1">
                        <button onclick="sendQuickMessage('support')" class="suggestion-chip whitespace-nowrap bg-cyan-500/10 hover:bg-cyan-500/30 border border-cyan-500/30 text-cyan-300 px-3 py-1.5 rounded-full text-xs font-medium" data-i18n="portal_chip_support">Hỗ trợ dịch vụ</button>
                        <button onclick="sendQuickMessage('promo')" class="suggestion-chip whitespace-nowrap bg-emerald-500/10 hover:bg-emerald-500/30 border border-emerald-500/30 text-emerald-300 px-3 py-1.5 rounded-full text-xs font-medium" data-i18n="portal_chip_promo">Hỏi ưu đãi</button>
                        <button onclick="sendQuickMessage('complaint')" class="suggestion-chip whitespace-nowrap bg-rose-500/10 hover:bg-rose-500/30 border border-rose-500/30 text-rose-300 px-3 py-1.5 rounded-full text-xs font-medium" data-i18n="portal_chip_complaint">Khiếu nại / góp ý</button>
                        <button onclick="sendQuickMessage('booking')" class="suggestion-chip whitespace-nowrap bg-purple-500/10 hover:bg-purple-500/30 border border-purple-500/30 text-purple-300 px-3 py-1.5 rounded-full text-xs font-medium" data-i18n="portal_chip_booking">Đặt lịch</button>
                        <button onclick="sendQuickMessage('warranty')" class="suggestion-chip whitespace-nowrap bg-yellow-500/10 hover:bg-yellow-500/30 border border-yellow-500/30 text-yellow-300 px-3 py-1.5 rounded-full text-xs font-medium" data-i18n="portal_chip_warranty">Bảo hành</button>
                    </div>
                </div>

                <!-- Toolbar + Input -->
                <div class="p-3 bg-black/60 border-t border-white/10">
                    <div class="flex gap-3 mb-2 px-1">
                        <button id="emojiBtn" class="text-gray-300 hover:text-cyan-400 text-xl"><i class="far fa-smile-wink"></i></button>
                        <button id="imageUploadBtn" class="text-gray-300 hover:text-cyan-400 text-xl"><i class="far fa-image"></i></button>
                        <button id="gifUploadBtn" class="text-gray-300 hover:text-cyan-400 text-xl"><i class="fas fa-file-video"></i></button>
                    </div>
                    <div id="emojiPicker" class="emoji-picker">
                        <span>😀</span><span>😂</span><span>😍</span><span>🥰</span><span>😎</span><span>🤔</span>
                        <span>😢</span><span>😡</span><span>👍</span><span>❤️</span><span>🔥</span><span>🎉</span>
                        <span>💯</span><span>✅</span><span>🙏</span><span>😘</span><span>😁</span><span>🤣</span>
                    </div>
                    <form id="chatForm" class="relative" onsubmit="handleSendMessage(event)">
                        <input type="text" id="messageInput" placeholder="Nhập tin nhắn..." class="glass-input w-full pr-12 py-2 pl-4 rounded-full text-sm" data-i18n-placeholder="portal_placeholder_message">
                        <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white flex items-center justify-center shadow-lg active:scale-95 transition-transform">
                            <i class="fas fa-paper-plane text-xs"></i>
                        </button>
                    </form>
                    <input type="file" id="fileImageInput" accept="image/*" style="display: none;">
                    <input type="file" id="fileGifInput" accept="image/gif" style="display: none;">
                </div>
            </div>
        </main>

        <div class="text-center text-[9px] text-gray-500 py-2">
            <i class="fas fa-store"></i> <span data-i18n="portal_footer_note">Tin nhắn gửi trực tiếp tới tiệm</span> | BitPaw
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-24 left-1/2 -translate-x-1/2 w-full max-w-[280px] z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // Lấy customer_id từ URL — customer_id là CHUỖI (vd "business123:0900000000"),
        // KHÔNG được parseInt như code backend cũ (id số serial cũ đã không còn đúng với schema Mongo mới).
        const urlParams = new URLSearchParams(window.location.search);
        const customerId = urlParams.get('id');
        let currentCustomerId = customerId || null;
        // Đây là hội thoại THẬT giữa khách và nhân viên tiệm (nhân viên trả lời trong /ai_bot). Trước đây trang tự
        // "trả lời" bằng câu viết sẵn theo từ khoá (bảng giá gói + khuyến mãi tự bịa), tự gõ sai chính tả rồi sửa giả
        // làm người, tự nhắn "có đang online không" — đã gỡ hết. Trang chỉ hiển thị tin thật từ server.
        let shopName = '';
        let sentNoticeShown = false;
        let eventSource = null; // EventSource SSE thay cho realtime channel cũ
        let knownMessageCount = 0; // số tin nhắn đã render, dùng để chỉ append phần mới khi SSE báo có thay đổi

        // DOM
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const customerIdBadge = document.getElementById('customerIdBadge');
        const emojiBtn = document.getElementById('emojiBtn');
        const emojiPicker = document.getElementById('emojiPicker');
        const imageUploadBtn = document.getElementById('imageUploadBtn');
        const gifUploadBtn = document.getElementById('gifUploadBtn');
        const fileImageInput = document.getElementById('fileImageInput');
        const fileGifInput = document.getElementById('fileGifInput');

        // ========== MULTI-REGION i18n ==========
        let currentLang = localStorage.getItem('bitpaw_lang') || "{{ default_lang }}";
        const translations = {
            vi: {
                portal_header_title: 'Chat với tiệm',
                portal_status_line: 'Nhân viên tiệm trả lời tại đây',
                portal_loading_conversation: 'Đang tải hội thoại...',
                portal_chip_support: 'Hỗ trợ dịch vụ',
                portal_chip_promo: 'Hỏi ưu đãi',
                portal_chip_complaint: 'Khiếu nại / góp ý',
                portal_chip_booking: 'Đặt lịch',
                portal_chip_warranty: 'Bảo hành',
                portal_qm_support: 'Tôi cần hỗ trợ về dịch vụ',
                portal_qm_promo: 'Tiệm có ưu đãi nào cho khách quen không?',
                portal_qm_complaint: 'Tôi muốn góp ý / khiếu nại',
                portal_qm_booking: 'Tôi muốn đặt lịch',
                portal_qm_warranty: 'Cho tôi hỏi về chính sách bảo hành',
                portal_placeholder_message: 'Nhập tin nhắn...',
                portal_footer_note: 'Tin nhắn gửi trực tiếp tới tiệm',
                portal_no_id: 'Chưa có ID',
                portal_staff_label: 'Nhân viên tiệm',
                portal_ai_label: 'Trợ lý đặt lịch (AI)',
                portal_err_no_customer_id: 'Không tìm thấy mã khách hàng.',
                portal_err_no_customer: 'Không tìm thấy khách hàng',
                portal_err_upload: 'Lỗi upload',
                portal_err_send: 'Chưa gửi được tin nhắn, vui lòng thử lại.',
                portal_invalid_link: 'Link không hợp lệ.<br>Vui lòng quét mã QR hoặc liên hệ CSKH.',
                portal_loading: 'Đang tải...',
                portal_err_load_history: 'Lỗi tải lịch sử',
                portal_empty_note: 'Chưa có tin nhắn. Nhắn cho tiệm tại đây — nhân viên sẽ trả lời ngay trong khung chat này khi có thể.',
                portal_sent_note: 'Đã gửi tới tiệm. Nhân viên sẽ trả lời tại đây.'
            },
            en: {
                portal_header_title: 'Chat with the shop',
                portal_status_line: 'Shop staff reply here',
                portal_loading_conversation: 'Loading conversation...',
                portal_chip_support: 'Service Support',
                portal_chip_promo: 'Ask about offers',
                portal_chip_complaint: 'Complaint / feedback',
                portal_chip_booking: 'Book Appointment',
                portal_chip_warranty: 'Warranty',
                portal_qm_support: 'I need help with a service',
                portal_qm_promo: 'Do you have any offers for returning customers?',
                portal_qm_complaint: 'I have some feedback / a complaint',
                portal_qm_booking: "I'd like to book an appointment",
                portal_qm_warranty: 'Can I ask about your warranty policy?',
                portal_placeholder_message: 'Type a message...',
                portal_footer_note: 'Messages go straight to the shop',
                portal_no_id: 'No ID yet',
                portal_staff_label: 'Shop staff',
                portal_ai_label: 'Booking assistant (AI)',
                portal_err_no_customer_id: 'Customer ID not found.',
                portal_err_no_customer: 'Customer not found',
                portal_err_upload: 'Upload error',
                portal_err_send: 'Message not sent — please try again.',
                portal_invalid_link: 'Invalid link.<br>Please scan the QR code or contact support.',
                portal_loading: 'Loading...',
                portal_err_load_history: 'Error loading history',
                portal_empty_note: 'No messages yet. Write to the shop here — staff will reply in this chat as soon as they can.',
                portal_sent_note: 'Sent to the shop. Staff will reply here.'
            }
        };
        function t(key) {
            return (translations[currentLang] && translations[currentLang][key]) || translations.vi[key] || key;
        }
        function tf(key, params) {
            let str = t(key);
            for (const k in params) str = str.split(`{${k}}`).join(params[k]);
            return str;
        }
        function applyStaticTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => { if (el.closest('#app-sidebar')) return; const k = el.getAttribute('data-i18n'), v = t(k); if (v !== k) el.innerHTML = v; });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
            const langBtn = document.getElementById('langToggleBtn');
            if (langBtn) langBtn.innerText = currentLang === 'vi' ? 'EN' : 'VI';
        }
        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('bitpaw_lang', lang);
            applyStaticTranslations();
            renderIdBadge();
        }
        // id lấy từ URL -> chỉ gán bằng textContent (trước đây chèn innerHTML: ?id=<img onerror=...> chạy được script)
        function renderIdBadge() {
            customerIdBadge.innerHTML = currentCustomerId ? '<i class="fas fa-user-check"></i> ' : '<i class="fas fa-exclamation-triangle text-yellow-400"></i> ';
            customerIdBadge.appendChild(document.createTextNode(currentCustomerId ? `ID: ${currentCustomerId}` : t('portal_no_id')));
        }
        applyStaticTranslations();
        const langToggleBtn = document.getElementById('langToggleBtn');
        if (langToggleBtn) {
            langToggleBtn.addEventListener('click', () => changeLanguage(currentLang === 'vi' ? 'en' : 'vi'));
        }

        renderIdBadge();

        // Helper
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const color = type === 'success' ? 'emerald' : 'cyan';
            toast.className = `bg-black/80 backdrop-blur-lg border border-${color}-500/50 text-white px-3 py-2 rounded-xl text-xs flex items-center gap-2 shadow-xl`;
            toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'info-circle'} text-${color}-400"></i> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }

        // Hiển thị tin nhắn (hỗ trợ ảnh/GIF). sender: 'user'/'customer' = khách, 'staff' = nhân viên tiệm,
        // 'ai' = trợ lý đặt lịch AI THẬT do server ghi (cùng hội thoại với khung chat trên trang đặt lịch) — ghi rõ là AI.
        function appendMessage(sender, text, time = null, mediaUrl = null, isGif = false) {
            const loc = currentLang === 'vi' ? 'vi-VN' : 'en-US';
            const timeStr = (time ? new Date(time) : new Date()).toLocaleTimeString(loc, { hour:'2-digit', minute:'2-digit' });
            const isUser = (sender === 'user' || sender === 'customer');
            const isAi = sender === 'ai';
            const initial = escapeHtml((shopName || '').trim().charAt(0).toUpperCase());
            const avatarHtml = isUser ? '' : `<div class="w-7 h-7 rounded-full bg-gradient-to-br from-cyan-600 to-blue-600 flex items-center justify-center flex-shrink-0 mt-1 text-white text-xs font-semibold">${isAi ? '<i class="fas fa-robot"></i>' : (initial || '<i class="fas fa-store"></i>')}</div>`;
            const bubbleClass = isUser ? 'chat-user' : 'chat-ai';
            const justifyClass = isUser ? 'justify-end' : 'justify-start';
            const nameLabel = isUser ? '' : '<p class="text-[9px] text-cyan-400 mb-0.5 ml-1">' + escapeHtml(isAi ? t('portal_ai_label') : (shopName || t('portal_staff_label'))) + '</p>';

            let contentHtml = '';
            if (mediaUrl) {
                contentHtml = `<img src="${escapeHtml(mediaUrl)}" alt="" class="max-w-full rounded-lg mb-1 ${isGif ? 'max-h-40 object-contain' : 'max-h-48 object-cover'}">`;
            }
            if (text) contentHtml += `<div>${escapeHtml(text)}</div>`;

            const html = `
                <div class="flex ${justifyClass} gap-2">
                    ${avatarHtml}
                    <div class="max-w-[85%]">
                        ${nameLabel}
                        <div class="${bubbleClass} p-3 text-sm text-gray-200">${contentHtml}</div>
                        <p class="text-[8px] text-gray-500 ${isUser ? 'text-right' : 'ml-1'} mt-0.5">${timeStr}</p>
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        // Ghi chú cục bộ của trang (KHÔNG lưu lên server, không đóng giả tin nhắn của ai)
        function appendNote(text) {
            chatBox.insertAdjacentHTML('beforeend', `<div class="portal-note text-center text-[11px] text-gray-400 px-4 py-2">${escapeHtml(text)}</div>`);
            scrollToBottom();
        }

        // Ghi 1 tin nhắn của KHÁCH vào backend. Route public này chỉ nhận sender_type='customer': trả lời của nhân viên
        // đi qua /api/bot/messages (đăng nhập), trả lời của trợ lý AI do server tự ghi.
        // Nội dung các tin đã render optimistic ở tab này, chờ được "khớp" và bỏ qua khi
        // /api/portal/stream báo có thay đổi rồi ta gọi lại /api/portal/messages — tránh hiển thị lặp
        // (endpoint stream chỉ báo tín hiệu, không phân biệt tin đó do chính tab này vừa gửi hay không).
        const ownPendingContents = [];
        async function postPortalMessage(content) {
            if (!currentCustomerId) return { success: false };
            ownPendingContents.push(content);
            try {
                const res = await fetch('/api/portal/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ customer_id: currentCustomerId, content, sender_type: 'customer' })
                });
                const json = await res.json();
                if (!json.success) {
                    console.error('Lỗi lưu tin nhắn:', json.message);
                    const idx = ownPendingContents.indexOf(content);
                    if (idx !== -1) ownPendingContents.splice(idx, 1);
                }
                return json;
            } catch (e) {
                console.error('Lỗi lưu tin nhắn:', e);
                const idx = ownPendingContents.indexOf(content);
                if (idx !== -1) ownPendingContents.splice(idx, 1);
                return { success: false };
            }
        }

        // Render 1 message doc từ backend ra chatBox (dùng chung cho loadHistory và cập nhật SSE).
        // Link ảnh chỉ nhận http(s):// hoặc đường dẫn nội bộ "/..." (ảnh tải lên qua /api/portal/upload) và không chứa
        // dấu nháy/<> — trước đây "[IMG]https://x\"onerror=..." chèn được thuộc tính vào thẻ <img>.
        const MEDIA_RE = /^\[(IMG|GIF)\]((?:https?:\/\/|\/(?!\/))[^\s"'<>]+)/;
        function renderStoredMessage(msg) {
            const senderType = msg.sender_type === 'customer' ? 'user' : (msg.sender_type === 'ai' ? 'ai' : 'staff');
            const content = String(msg.content || '');
            const media = content.match(MEDIA_RE);
            if (media) {
                appendMessage(senderType, '', msg.created_at, media[2], media[1] === 'GIF');
            } else {
                appendMessage(senderType, content, msg.created_at);
            }
        }

        // Tin của khách: hiện ngay + lưu server. Không có câu trả lời tự động nào ở trang này — nhân viên tiệm trả lời thật.
        async function sendCustomerText(text) {
            appendMessage('user', text);
            const res = await postPortalMessage(text);
            if (!res || !res.success) { showToast(t('portal_err_send'), 'error'); return; }
            if (!sentNoticeShown) { sentNoticeShown = true; appendNote(t('portal_sent_note')); }
        }

        async function handleSendMessage(e) {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;
            if (!currentCustomerId) {
                showToast(t('portal_err_no_customer_id'), 'error');
                return;
            }
            messageInput.value = '';
            await sendCustomerText(text);
        }

        // Gửi ảnh/GIF
        async function sendMedia(file, isGif = false) {
            if (!currentCustomerId) {
                showToast(t('portal_err_no_customer'), 'error');
                return;
            }
            if (!file) return;
            try {
                const formData = new FormData();
                formData.append('customer_id', currentCustomerId);
                formData.append('file', file);
                const res = await fetch('/api/portal/upload', { method: 'POST', body: formData });
                const json = await res.json();
                if (!json.success) {
                    showToast(t('portal_err_upload'), 'error');
                    return;
                }
                const mediaUrl = json.url;
                appendMessage('user', '', null, mediaUrl, isGif);
                // Quy ước prefix [IMG]/[GIF] giống templates/chat.html để tương thích khi hiển thị lại
                const contentText = isGif ? `[GIF]${mediaUrl}` : `[IMG]${mediaUrl}`;
                const saved = await postPortalMessage(contentText);
                if (!saved || !saved.success) showToast(t('portal_err_send'), 'error');
            } catch (e) {
                showToast(t('portal_err_upload'), 'error');
            }
        }

        // Emoji picker
        emojiBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            emojiPicker.style.display = emojiPicker.style.display === 'grid' ? 'none' : 'grid';
        });
        document.addEventListener('click', () => {
            emojiPicker.style.display = 'none';
        });
        emojiPicker.querySelectorAll('span').forEach(emojiSpan => {
            emojiSpan.addEventListener('click', (e) => {
                e.stopPropagation();
                messageInput.value += emojiSpan.innerText;
                messageInput.focus();
                emojiPicker.style.display = 'none';
            });
        });

        imageUploadBtn.addEventListener('click', () => fileImageInput.click());
        gifUploadBtn.addEventListener('click', () => fileGifInput.click());
        fileImageInput.addEventListener('change', async (e) => {
            if (e.target.files.length) await sendMedia(e.target.files[0], false);
            fileImageInput.value = '';
        });
        fileGifInput.addEventListener('change', async (e) => {
            if (e.target.files.length) await sendMedia(e.target.files[0], true);
            fileGifInput.value = '';
        });

        // Nút gợi ý gửi câu hỏi theo ĐÚNG ngôn ngữ đang hiển thị (trước đây luôn gửi tiếng Việt)
        window.sendQuickMessage = async function(key) {
            messageInput.value = t('portal_qm_' + key);
            await handleSendMessage(new Event('submit'));
        };

        // ========== REALTIME (Portal) — SSE thay cho realtime channel cũ ==========
        // /api/portal/stream chỉ là tín hiệu "có gì mới", không mang dữ liệu — mỗi lần nhận
        // signal ta gọi lại /api/portal/messages rồi chỉ append phần tin nhắn mới (so với knownMessageCount).
        async function refreshFromServer() {
            if (!currentCustomerId) return;
            try {
                const res = await fetch(`/api/portal/messages?customer_id=${encodeURIComponent(currentCustomerId)}`);
                const json = await res.json();
                if (!json.success || !Array.isArray(json.data)) return;
                const newMessages = json.data.slice(knownMessageCount);
                knownMessageCount = json.data.length;
                newMessages.forEach(msg => {
                    // Bỏ qua tin nhắn nội dung khớp với tin khách vừa optimistic-render + POST từ chính tab này — tránh hiển thị lặp.
                    const pendingIdx = msg.sender_type === 'customer' ? ownPendingContents.indexOf(msg.content) : -1;
                    if (pendingIdx !== -1) {
                        ownPendingContents.splice(pendingIdx, 1);
                        return;
                    }
                    renderStoredMessage(msg);
                });
                if (newMessages.length) scrollToBottom();
            } catch (e) {
                console.warn('Lỗi refresh tin nhắn từ SSE:', e);
            }
        }

        function subscribeToRealtime() {
            if (!currentCustomerId) return;
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            eventSource = new EventSource(`/api/portal/stream?customer_id=${encodeURIComponent(currentCustomerId)}`);
            eventSource.onmessage = () => { refreshFromServer(); };
            eventSource.onerror = (e) => { console.warn('SSE lỗi kết nối:', e); };
        }

        // ========== LOAD LỊCH SỬ ==========
        async function loadHistory() {
            if (!currentCustomerId) {
                chatBox.innerHTML = '<div class="text-center text-gray-400 py-10">' + t('portal_invalid_link') + '</div>';
                return;
            }
            chatBox.innerHTML = '<div class="flex justify-center py-10"><i class="fas fa-circle-notch fa-spin text-2xl text-cyan-400"></i><span class="ml-2 text-gray-400">' + t('portal_loading') + '</span></div>';
            let json;
            try {
                const res = await fetch(`/api/portal/messages?customer_id=${encodeURIComponent(currentCustomerId)}`);
                json = await res.json();
                if (!res.ok || !json.success) {
                    chatBox.innerHTML = '<div class="text-center text-red-400 py-10">' + t('portal_err_load_history') + '</div>';
                    return;
                }
            } catch (e) {
                chatBox.innerHTML = '<div class="text-center text-red-400 py-10">' + t('portal_err_load_history') + '</div>';
                return;
            }
            if (json.shop_name) {
                shopName = String(json.shop_name);
                const title = document.getElementById('portalTitle'), av = document.getElementById('portalAvatar');
                title.textContent = shopName; av.textContent = shopName.trim().charAt(0).toUpperCase();
                document.title = shopName;
            }
            const data = json.data || [];
            chatBox.innerHTML = '';
            knownMessageCount = data.length;
            if (data.length === 0) {
                appendNote(t('portal_empty_note'));
            } else {
                data.forEach(renderStoredMessage);
            }
            scrollToBottom();
            // Sau khi load xong, kích hoạt SSE
            subscribeToRealtime();
        }

        // Khởi động
        loadHistory();
        messageInput.focus();
    </script>
    {# không nhúng khối liên hệ + bong bóng chat của BitPaw: đây là khung chat của QUÁN với khách của quán #}
</body>
