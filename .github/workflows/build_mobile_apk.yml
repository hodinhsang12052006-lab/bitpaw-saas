name: Build Mobile APK

# Build tạm thời trên máy ảo Ubuntu sạch của GitHub — máy dev Windows local bị 1 driver
# mạng chặn kết nối loopback nội bộ mà JDK 17 cần dùng để chạy Gradle (không liên quan gì
# đến code Flutter, đã xác nhận qua nhiều lần đổi JDK/tắt phần mềm bảo mật trên máy local).
on:
  push:
    branches:
      - mobile-app-ci
    paths:
      - "mobile_app/**"
      - ".github/workflows/build_mobile_apk.yml"
  workflow_dispatch:

permissions:
  contents: write

# Nhiều push liên tiếp trong thời gian ngắn (vd đẩy nhiều tính năng liền nhau) trước đây khiến
# nhiều run CÙNG chạy song song, tất cả cùng ghi vào 1 release tag cố định
# (mobile-debug-latest) -> tranh chấp/deadlock ở bước publish, có run bị treo hàng chục phút.
# concurrency group theo branch + cancel-in-progress: true đảm bảo push mới nhất luôn tự huỷ
# run cũ đang chạy dở của CÙNG branch trước khi bắt đầu — chỉ 1 run/branch tồn tại tại 1 thời
# điểm, loại bỏ hoàn toàn kiểu tranh chấp này.
concurrency:
  group: mobile-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable

      - run: flutter pub get
      # flutter analyze thoát mã khác 0 ngay cả khi chỉ có cảnh báo info-level (vd withOpacity
      # deprecated) — không chặn build vì đó không phải lỗi thật, chỉ để xem log tham khảo.
      - run: flutter analyze || true
      - run: flutter build apk --debug

      - name: Publish debug APK as a release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-debug-latest
          name: "Mobile App – Debug APK (auto-build)"
          body: "APK debug tự động build từ nhánh mobile-app-ci, dùng để cài thử trên điện thoại thật. KHÔNG phải bản release nộp CH Play."
          prerelease: true
          files: mobile_app/build/app/outputs/flutter-apk/app-debug.apk

      # Bản AAB ký thật để nộp Google Play — CHỈ chạy khi đã cấu hình secret
      # ANDROID_KEYSTORE_BASE64 trong repo (Settings > Secrets and variables > Actions). Không
      # cấu hình -> bỏ qua an toàn, vẫn có bản debug APK ở trên để test.
      - name: Check release signing secret
        id: check_signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.check_signing.outputs.has_secret == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties << PROPS
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS

      - name: Build signed release AAB
        if: steps.check_signing.outputs.has_secret == 'true'
        run: flutter build appbundle --release

      - name: Publish release AAB as a release asset
        if: steps.check_signing.outputs.has_secret == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-release-latest
          name: "Mobile App – Release AAB (ký, nộp CH Play)"
          body: "Bản .aab đã ký bằng upload key thật — tải file này lên Google Play Console."
          prerelease: false
          files: mobile_app/build/app/outputs/bundle/release/app-release.aab

  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable

      - run: flutter pub get
      - run: flutter analyze || true

      # Build KHÔNG ký — chỉ xác nhận toàn bộ code Dart + mọi plugin (geolocator, mobile_scanner,
      # image_picker, signature, flutter_secure_storage) thật sự biên dịch/link đúng cho iOS.
      # KHÔNG cần tài khoản Apple Developer cho bước này — chạy được ngay dù chưa có gì để ký.
      - run: flutter build ios --release --no-codesign

      # ========================================================================================
      # BẢN IPA KÝ THẬT ĐỂ NỘP APP STORE — CHỈ chạy khi đã cấu hình đủ secret bên dưới.
      # Thiếu bất kỳ secret nào -> bỏ qua an toàn, vẫn có build không-ký ở trên để xác nhận code ổn.
      #
      # KHÁC VỚI PHẦN ANDROID (đã build/verify thật): phần ký iOS này viết theo đúng quy trình
      # CI chuẩn của Apple (import .p12 vào keychain tạm + cài provisioning profile +
      # export theo ExportOptions.plist) nhưng CHƯA từng chạy thật lần nào vì chưa có tài khoản
      # Apple Developer để lấy chứng chỉ/provisioning profile thật — cần chạy thử + có thể phải
      # chỉnh sau khi bạn cung cấp secret thật.
      #
      # 5 secret cần thêm (Settings > Secrets and variables > Actions), lấy từ
      # developer.apple.com sau khi đăng ký Apple Developer Program:
      #   IOS_CERTIFICATE_BASE64        — file .p12 (Distribution certificate) encode base64
      #   IOS_CERTIFICATE_PASSWORD      — mật khẩu đặt lúc export .p12 từ Keychain Access
      #   IOS_PROVISION_PROFILE_BASE64  — file .mobileprovision (App Store profile) encode base64
      #   IOS_TEAM_ID                   — Team ID trong Apple Developer account (vd "ABCDE12345")
      # ========================================================================================
      - name: Check App Store signing secrets
        id: check_ios_signing
        run: |
          if [ -n "${{ secrets.IOS_CERTIFICATE_BASE64 }}" ] && [ -n "${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate + provisioning profile
        if: steps.check_ios_signing.outputs.has_secret == 'true'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychain -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')

          echo "$IOS_CERTIFICATE_BASE64" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build signed IPA
        if: steps.check_ios_signing.outputs.has_secret == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>$IOS_TEAM_ID</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          PLIST
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Publish signed IPA as a release asset
        if: steps.check_ios_signing.outputs.has_secret == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-ios-release-latest
          name: "Mobile App – iOS IPA (ký, nộp App Store)"
          body: "Bản .ipa đã ký — tải lên qua Transporter hoặc App Store Connect để nộp App Store."
          prerelease: false
          files: mobile_app/build/ios/ipa/*.ipa
