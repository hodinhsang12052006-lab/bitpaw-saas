# Build app mobile BitPaw OS (mobile_app/, Flutter WebView) cho CH Play + App Store.
# Máy dev Windows không build được (Gradle bị chặn loopback; iOS bắt buộc macOS) nên build ở đây.
#
# Android (CH Play): tạo file .aab. Ký bằng keystore release THẬT nếu repo có đủ 4 secret:
#   ANDROID_KEYSTORE_BASE64   = nội dung base64 của mobile_app/android/app/bitpaw-release.jks
#   ANDROID_KEYSTORE_PASSWORD = storePassword trong mobile_app/android/key.properties
#   ANDROID_KEY_ALIAS         = keyAlias
#   ANDROID_KEY_PASSWORD      = keyPassword
# Thiếu secret -> vẫn build (ký debug) để kiểm tra code biên dịch được, nhưng file đó KHÔNG nộp
# lên CH Play được — job in cảnh báo rõ ràng.
#
# iOS (App Store): build release không ký (--no-codesign) để kiểm tra biên dịch. Ký + tải lên App
# Store Connect cần chứng chỉ Apple Developer — xem audit-results/STORE_SUBMISSION_PLAN.md.
name: Mobile build

on:
  push:
    branches: [main]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  android:
    name: Android (.aab for CH Play)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PW" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PW" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/bitpaw-release.jks
            {
              echo "storePassword=$STORE_PW"
              echo "keyPassword=$KEY_PW"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=bitpaw-release.jks"
            } > android/key.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Chua cau hinh secret keystore -> .aab ky bang debug key, KHONG nop len CH Play duoc."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: bitpaw-os-android-${{ env.SIGNED == 'true' && 'release-signed' || 'debug-signed' }}
          path: mobile_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    name: iOS (compile check, no codesign)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned Runner.app
        run: cd build/ios/iphoneos && zip -qr Runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: bitpaw-os-ios-unsigned
          path: mobile_app/build/ios/iphoneos/Runner-unsigned.zip
          if-no-files-found: error
